name: CodeQL

on:
  pull_request:
  # Feature branches are covered by pull_request; this catches whatever lands on main.
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1" # Weekly on Monday

# Write privilege: job uploads SARIF results to the Security tab.
permissions:
  contents: read
  security-events: write

# CodeQL runs are slower than lint/test; cancel stale ones regardless of event type.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none  # JS/TS is parsed directly; no build step to run.
      - uses: github/codeql-action/analyze@v4
